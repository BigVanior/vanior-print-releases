[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-print-optimizer"
version = "0.6.6"
description = "VANIOR PRINT with automatic topology repair, quality-constrained slicing and real layer preview"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Ivan Valevich", email = "vanovik2k18@gmail.com"},
]
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
keywords = ["3d-printing", "stl", "3mf", "direct-printer", "slicing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "numpy>=2.0,<3.0",
    "trimesh>=4.5,<5.0",
    "fast-simplification>=0.1.13,<0.2",
    "shapely>=2.1,<3.0",
    "Pillow>=12.0,<13.0",
    "PySide6>=6.8,<7",
    "paho-mqtt>=2.1,<3.0",
]

[project.scripts]
ai-print-optimizer = "ai_print_optimizer.cli:main"

[project.gui-scripts]
ai-print-optimizer-gui = "ai_print_optimizer.vanior_gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_print_optimizer = ["schemas/*.json", "assets/*.png", "assets/*.ico", "assets/*.svg", "assets/navigation/*.png"]
